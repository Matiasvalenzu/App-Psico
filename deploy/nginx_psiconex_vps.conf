server {
    listen 80;
    server_name psiconex.cl www.psiconex.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name psiconex.cl www.psiconex.cl;

    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/psiconex.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psiconex.cl/privkey.pem;

    location ~ ^/(login|dashboard|tests)(/.*)?$ {
        return 301 https://app.psiconex.cl$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name app.psiconex.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.psiconex.cl;

    client_max_body_size 200M;

    ssl_certificate /etc/letsencrypt/live/app.psiconex.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.psiconex.cl/privkey.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/signaling/ {
        proxy_pass http://127.0.0.1:3000/ws/signaling/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
