<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DatnexiA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; width: 280px; background: #0f172a; color: #e2e8f0; padding: 16px; }
    .logo { font-size: 18px; font-weight: 700; color: #38bdf8; margin-bottom: 12px; }
    .status { font-size: 12px; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; }
    .status.active { background: #064e3b; color: #6ee7b7; border: 1px solid #065f46; }
    .status.inactive { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    label { font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px; margin-top: 10px; }
    input { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 12px; }
    input:focus { outline: none; border-color: #38bdf8; }
    button { width: 100%; margin-top: 10px; padding: 8px; border-radius: 6px; border: none; background: #0284c7; color: white; font-size: 12px; font-weight: 600; cursor: pointer; }
    button:hover { background: #0369a1; }
    .counter { font-size: 20px; font-weight: 700; color: #38bdf8; }
    .hint { font-size: 10px; color: #64748b; margin-top: 8px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="logo">DatnexiA</div>
  <div id="status" class="status inactive">Sin sesión activa</div>
  <div id="counter" style="display:none">
    <div class="counter" id="count">0</div>
    <div style="font-size:11px;color:#94a3b8">segmentos capturados</div>
  </div>

  <label>URL del backend</label>
  <input id="backendUrl" type="url" placeholder="http://localhost:8000" />

  <label>Session ID (manual)</label>
  <input id="sessionId" type="text" placeholder="Ej: 21" />

  <label>Token JWT (manual)</label>
  <input id="token" type="text" placeholder="eyJ..." />

  <button id="saveBtn">Guardar y conectar</button>

  <p class="hint">Normalmente la extensión se conecta automáticamente cuando creas una sesión virtual en la app. Usa los campos manuales solo si hay problemas.</p>

  <script src="popup.js"></script>
</body>
</html>
