version: "3.9"

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: app.psiconex.cl,localhost,127.0.0.1
  CORS_ALLOWED_ORIGINS: https://app.psiconex.cl,https://psiconex.cl
  POSTGRES_DB: ${POSTGRES_DB:-psicologo}
  POSTGRES_USER: ${POSTGRES_USER:-psicologo}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
  PUBLIC_APP_URL: https://app.psiconex.cl
  TEST_LINK_EXPIRATION_DAYS: ${TEST_LINK_EXPIRATION_DAYS:-7}
  DSM5_DOCUMENT_PATH: ${DSM5_DOCUMENT_PATH:-/app/informes/dsm5-manualdiagnsticoyestadisticodelostrastornosmentales-161006005112.pdf}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
  EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-15}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@datnexia.com}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Psiconex}
  EMAIL_SUPPORT_ADDRESS: ${EMAIL_SUPPORT_ADDRESS:-psiconex@datnexia.com}
  EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-https://app.psiconex.cl/logo-psiconex.png}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_CALENDAR_REDIRECT_URI: https://app.psiconex.cl/api/agenda/google/callback/
  GOOGLE_CALENDAR_RETURN_URL: https://app.psiconex.cl
  GOOGLE_CALENDAR_NAME: ${GOOGLE_CALENDAR_NAME:-Agenda Psiconex}
  AUDIO_STORAGE_PATH: /data/audio
  DOCUMENT_UPLOAD_MAX_BYTES: ${DOCUMENT_UPLOAD_MAX_BYTES:-10485760}
  WHISPER_MODEL: ${WHISPER_MODEL:-base}
  WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
  WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
  PYANNOTE_AUTH_TOKEN: ${PYANNOTE_AUTH_TOKEN:-}
  PYANNOTE_API_BASE_URL: ${PYANNOTE_API_BASE_URL:-https://api.pyannote.ai}
  PYANNOTE_API_MODEL: ${PYANNOTE_API_MODEL:-precision-2}
  PYANNOTE_API_TIMEOUT_SECONDS: ${PYANNOTE_API_TIMEOUT_SECONDS:-3600}
  PYANNOTE_API_POLL_INTERVAL_SECONDS: ${PYANNOTE_API_POLL_INTERVAL_SECONDS:-10}
  PYANNOTE_API_REQUEST_TIMEOUT_SECONDS: ${PYANNOTE_API_REQUEST_TIMEOUT_SECONDS:-60}
  PYANNOTE_API_UPLOAD_TIMEOUT_SECONDS: ${PYANNOTE_API_UPLOAD_TIMEOUT_SECONDS:-300}
  SPEAKER_EMBEDDING_MODEL: ${SPEAKER_EMBEDDING_MODEL:-speechbrain/spkrec-ecapa-voxceleb}
  SPEAKER_EMBEDDING_CACHE_DIR: ${SPEAKER_EMBEDDING_CACHE_DIR:-/data/models/speechbrain}
  SPEAKER_EMBEDDING_DEVICE: ${SPEAKER_EMBEDDING_DEVICE:-cpu}
  SPEAKER_MATCH_THRESHOLD: ${SPEAKER_MATCH_THRESHOLD:-0.35}
  SPEAKER_MATCH_MARGIN: ${SPEAKER_MATCH_MARGIN:-0.05}
  SPEAKER_MIN_TURN_SECONDS: ${SPEAKER_MIN_TURN_SECONDS:-1.0}
  SPEAKER_MIN_TOTAL_SECONDS: ${SPEAKER_MIN_TOTAL_SECONDS:-3.0}
  SPEAKER_MAX_SECONDS_PER_LABEL: ${SPEAKER_MAX_SECONDS_PER_LABEL:-30.0}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  EMBEDDING_USE_MODEL: ${EMBEDDING_USE_MODEL:-False}
  MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
  MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}

services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psicologo}
      POSTGRES_USER: ${POSTGRES_USER:-psicologo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psicologo} -d ${POSTGRES_DB:-psicologo}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-2} --timeout ${GUNICORN_TIMEOUT:-180}"
    environment:
      <<: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./Informes:/app/informes:ro
      - audio_data:/data/audio
      - model_cache:/data/models
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    command: celery -A config.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-1}
    environment:
      <<: *backend-env
    volumes:
      - ./Informes:/app/informes:ro
      - audio_data:/data/audio
      - model_cache:/data/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-email:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    command: celery -A config.celery_app worker --loglevel=info --concurrency=1 --queues=email
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    command: celery -A config.celery_app beat --loglevel=info
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: https://app.psiconex.cl/api
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend

  marketing:
    build:
      context: ./marketing
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: https://app.psiconex.cl
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3001"

  app_gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  audio_data:
  model_cache:
  static_data:
